<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Grid: filas, columnas y espacios</title><desc id="desc">Una cuadrícula controla dos dimensiones. Las columnas son verticales y las filas horizontales. gap separa las pistas; un elemento puede abarcar varias.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><text x="32" y="42">3 columnas × 2 filas</text><g fill="#cffafe" stroke="#0e7490" stroke-width="2"><rect x="32" y="72" width="180" height="100" rx="8"/><rect x="232" y="72" width="180" height="100" rx="8"/><rect x="432" y="72" width="180" height="100" rx="8"/><rect x="32" y="192" width="380" height="100" rx="8" fill="#c7d2fe"/><rect x="432" y="192" width="180" height="100" rx="8"/></g><text x="320" y="132" text-anchor="middle">fila 1</text><text x="222" y="252" text-anchor="middle">grid-column: span 2</text><text x="448" y="333">gap: 20px</text><path d="M417 310h12m-12-5v10m12-10v10" stroke="#92400e" stroke-width="3"/></g></svg>

