<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">clamp limita un valor flexible</title><desc id="desc">clamp(mínimo, preferido, máximo) usa el valor preferido mientras esté entre los límites. Fuera del intervalo conserva el mínimo o el máximo.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><text x="32" y="44">clamp(24px, 4vw, 48px)</text><path d="M64 84v204h536" fill="none" stroke="#64748b" stroke-width="3"/><path d="M80 248h160L440 120h144" fill="none" stroke="#4338ca" stroke-width="8" stroke-linejoin="round"/><g stroke="#0e7490" stroke-dasharray="6 6"><path d="M64 248H600M64 120H600"/></g><text x="86" y="222">mínimo 24px</text><text x="418" y="94">máximo 48px</text><text x="246" y="332">ancho del viewport →</text><text x="274" y="160">4vw</text></g></svg>

