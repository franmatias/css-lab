<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Transformar no cambia el flujo</title><desc id="desc">translate, rotate y scale cambian la representación visual. El hueco original en el flujo permanece. La transformación puede solaparse con otras cajas.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><g fill="none" stroke="#64748b" stroke-dasharray="7 5" stroke-width="2"><rect x="40" y="108" width="140" height="140"/><rect x="250" y="108" width="140" height="140"/><rect x="460" y="108" width="140" height="140"/></g><g fill="#c7d2fe" fill-opacity=".8" stroke="#4338ca" stroke-width="3"><rect x="60" y="80" width="140" height="140"/><rect x="250" y="108" width="140" height="140" transform="rotate(18 320 178)"/><rect x="460" y="108" width="140" height="140" transform="translate(530 178) scale(.7) translate(-530 -178)"/></g><g text-anchor="middle"><text x="120" y="310">translate</text><text x="320" y="310">rotate</text><text x="530" y="310">scale</text></g><text x="32" y="44">Trazo discontinuo = hueco original</text></g></svg>

