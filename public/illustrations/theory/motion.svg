<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Tres fotogramas, un recorrido</title><desc id="desc">keyframes define estados. El navegador interpola entre ellos según duración y curva de ritmo. Una transición responde a un cambio de estado; una animación sigue fotogramas.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><text x="32" y="44">@keyframes recorrido</text><path d="M72 190H568" stroke="#64748b" stroke-width="4" stroke-dasharray="8 7"/><g fill="#c7d2fe" stroke="#4338ca" stroke-width="3"><circle cx="88" cy="190" r="34"/><circle cx="320" cy="190" r="46"/><circle cx="552" cy="190" r="34"/></g><g text-anchor="middle"><text x="88" y="120">0%</text><text x="320" y="100">50%</text><text x="552" y="120">100%</text><text x="88" y="270">inicio</text><text x="320" y="290">intermedio</text><text x="552" y="270">final</text></g></g></svg>

