<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Flexbox: eje principal y eje transversal</title><desc id="desc">Con flex-direction row, el eje principal sigue la línea de escritura. justify-content distribuye en ese eje y align-items en el transversal. column intercambia los ejes.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><text x="32" y="44">row · escritura horizontal LTR</text><path d="M64 94H584l-12-8m12 8-12 8M44 112V288l-8-12m8 12 8-12" fill="none" stroke="#4338ca" stroke-width="4"/><rect x="64" y="116" width="536" height="180" rx="12" fill="#fff" stroke="#64748b"/><g fill="#cffafe" stroke="#0e7490" stroke-width="2"><rect x="90" y="158" width="136" height="96" rx="10"/><rect x="264" y="158" width="136" height="96" rx="10"/><rect x="438" y="158" width="136" height="96" rx="10"/></g><g text-anchor="middle"><text x="158" y="215">1</text><text x="332" y="215">2</text><text x="506" y="215">3</text></g><text x="64" y="332">justify-content → · align-items ↓</text></g></svg>

