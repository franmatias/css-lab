<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">El modelo de caja</title><desc id="desc">De fuera hacia dentro: margen, borde, relleno y contenido. El margen queda fuera de las dimensiones de border-box.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><rect x="24" y="24" width="592" height="312" rx="16" fill="#fef3c7" stroke="#92400e" stroke-dasharray="8 6"/><text x="48" y="62">margin · espacio exterior</text><rect x="64" y="84" width="512" height="224" rx="10" fill="#c7d2fe" stroke="#4338ca" stroke-width="10"/><text x="90" y="120">border · borde</text><rect x="96" y="140" width="448" height="140" rx="8" fill="#cffafe" stroke="#0e7490"/><text x="120" y="172">padding · espacio interior</text><rect x="140" y="192" width="360" height="64" rx="6" fill="#fff" stroke="#334155"/><text x="320" y="233" text-anchor="middle">content · contenido</text></g></svg>

