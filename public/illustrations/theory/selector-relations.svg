<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">El DOM tiene relaciones</title><desc id="desc">En este árbol nav es padre de ul; ul es padre de los dos li. li + li selecciona el segundo hermano; nav li puede seleccionar descendientes a mayor profundidad.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><path d="M320 84v36m0 60v24m0 0H160v24m160-24h160v24" fill="none" stroke="#64748b" stroke-width="4"/><g fill="#fff" stroke="#4338ca" stroke-width="2"><rect x="240" y="24" width="160" height="60" rx="10"/><rect x="240" y="120" width="160" height="60" rx="10"/><rect x="80" y="228" width="160" height="60" rx="10"/><rect x="400" y="228" width="160" height="60" rx="10" fill="#cffafe"/></g><g text-anchor="middle"><text x="320" y="64">nav</text><text x="320" y="160">ul</text><text x="160" y="268">li · 1</text><text x="480" y="268">li · 2</text></g><text x="320" y="334" text-anchor="middle">nav &gt; ul &gt; li + li</text></g></svg>

