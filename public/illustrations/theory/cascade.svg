<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">La cascada toma decisiones en orden</title><desc id="desc">En un mismo origen y contexto: primero importancia y capas, después especificidad y orden de aparición. Con important se invierte la prioridad de las capas.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><g fill="#fff" stroke="#4338ca" stroke-width="2"><rect x="40" y="24" width="560" height="60" rx="12"/><rect x="40" y="108" width="560" height="60" rx="12"/><rect x="40" y="192" width="560" height="60" rx="12"/><rect x="40" y="276" width="560" height="60" rx="12"/></g><g text-anchor="middle"><text x="320" y="64">1 · Origen e importancia</text><text x="320" y="148">2 · Capas</text><text x="320" y="232">3 · Especificidad</text><text x="320" y="316">4 · Orden de aparición</text></g><path d="M320 84v24m0 60v24m0 60v24" stroke="#0e7490" stroke-width="4"/></g></svg>

