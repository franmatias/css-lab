<svg width="640" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Una tabla relaciona cabeceras y datos</title><desc id="desc">thead agrupa la cabecera, tbody los datos y tr cada fila. th identifica cabeceras; td contiene datos. nth-child cuenta posiciones entre hermanos.</desc><rect width="640" height="360" rx="20" fill="#eef0f8"/><g font-family="system-ui,sans-serif" font-size="24" fill="#1a1b2e"><g stroke="#64748b" stroke-width="2"><rect x="32" y="48" width="576" height="70" fill="#c7d2fe"/><rect x="32" y="118" width="576" height="70" fill="#fff"/><rect x="32" y="188" width="576" height="70" fill="#cffafe"/><path d="M224 48v210M416 48v210"/></g><g text-anchor="middle"><text x="128" y="94">th · Curso</text><text x="320" y="94">th · Aula</text><text x="512" y="94">th · Plazas</text><text x="128" y="164">DAM</text><text x="320" y="164">A1</text><text x="512" y="164">30</text><text x="128" y="234">DAW</text><text x="320" y="234">A2</text><text x="512" y="234">25</text><text x="320" y="320">tbody &gt; tr:nth-child(2)</text></g></g></svg>

